[package]
name = "satisfactory-overlay"
version = "0.1.0"
description = "Satisfactory planner overlay"
authors = []
license = "MIT"
edition = "2024"


[lib]
name = "satisfactory_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
